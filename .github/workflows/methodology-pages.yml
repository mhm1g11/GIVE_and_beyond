name: Publish GIVE methodology (Jupyter Book 2)

on:
  push:
    branches: [release-candidate]
    paths:
      - 'methodology/**'
      - '.github/workflows/methodology-pages.yml'
  workflow_dispatch:
  pull_request:
    branches: [release-candidate]
    paths:
      - 'methodology/**'
      - '.github/workflows/methodology-pages.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Jupyter Book 2
        run: python -m pip install "jupyter-book>=2.1,<3"
      - name: Build static website (no model execution)
        working-directory: methodology
        env:
          BASE_URL: /GIVE_and_beyond
        run: jupyter book build --html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: methodology/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
